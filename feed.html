<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch — Every Block Has a Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body.feed-body { height: 100%; overflow: hidden; background: #000; }
  .feed-header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
  }
  .feed-back {
    color: var(--cream); display: flex; align-items: center; gap: 6px;
    font-weight: 600; text-decoration: none; font-size: 0.9rem;
  }
  .feed-scroll {
    height: 100vh; width: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    background: #000;
  }
  .feed-slide {
    position: relative;
    height: 100vh; width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
    overflow: hidden;
  }
  .feed-slide iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: none;
  }
  .feed-fallback {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
  }
  .feed-gradient {
    position: absolute; left: 0; right: 0; bottom: 0; height: 45%;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    pointer-events: none;
  }
  .feed-info {
    position: absolute; left: 18px; right: 88px; bottom: 28px; color: var(--cream); z-index: 2;
  }
  .feed-info .feed-author {
    color: var(--cream); text-decoration: none; display: flex; align-items: center; gap: 8px;
    font-weight: 700; margin-bottom: 10px; font-size: 0.95rem;
  }
  .feed-info .feed-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
  .feed-info .feed-caption { font-size: 0.9rem; color: rgba(243,234,216,0.85); line-height: 1.4; }
  .feed-info .feed-loc { font-size: 0.8rem; color: rgba(243,234,216,0.7); margin-top: 8px; display: flex; align-items: center; gap: 4px; }
  .feed-actions {
    position: absolute; right: 14px; bottom: 28px; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 22px;
  }
  .feed-action-btn {
    background: none; border: none; color: var(--cream); display: flex; flex-direction: column;
    align-items: center; gap: 4px; cursor: pointer; font-size: 0.72rem; font-family: var(--sans);
    text-decoration: none; padding: 0;
  }
  .feed-action-icon {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(20,21,15,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .feed-action-btn.engagement-active .feed-action-icon { background: var(--orange); }
  .feed-empty, .feed-loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--cream-dim); background: #000; z-index: 10; text-align: center; padding: 20px;
  }
</style>
</head>
<body class="feed-body">

<div class="feed-header">
  <a href="stories.html" class="feed-back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Stories
  </a>
  <a href="index.html" class="logo" style="transform: scale(0.8);">
    <span class="logo-main"><span>EVERY</span> <span>BLOCK</span></span>
  </a>
</div>

<div id="feed-loading" class="feed-loading">Loading stories…</div>
<div id="feed-empty" class="feed-empty" style="display:none;">No stories to watch yet — be the first to share one.</div>
<div id="feed-scroll" class="feed-scroll" style="display:none;"></div>

<script src="script.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(window.location.search);
    const startId = params.get("id");
    const scrollEl = document.getElementById("feed-scroll");
    const loadingEl = document.getElementById("feed-loading");
    const emptyEl = document.getElementById("feed-empty");

    let videos = [];
    try {
      const res = await apiFetch("/api/videos");
      const data = await res.json();
      if (!res.ok) throw new Error("bad status");
      videos = (data.videos || []).map(videoToStoryShape).filter((v) => v.videoUrl);
    } catch (e) {
      videos = [];
    }

    loadingEl.style.display = "none";

    if (!videos.length) {
      emptyEl.style.display = "flex";
      return;
    }

    // If deep-linked to a specific story (e.g. from a share link), start there.
    if (startId) {
      const idx = videos.findIndex((v) => v.id === startId || v.id === "v_" + startId);
      if (idx > 0) {
        const [chosen] = videos.splice(idx, 1);
        videos.unshift(chosen);
      }
    }

    scrollEl.innerHTML = videos.map(feedSlideHTML).join("");
    scrollEl.style.display = "block";

    initFeedPlayback(scrollEl);
    initFeedActions(scrollEl, videos);

    // Up/down arrow keys move one slide at a time — handy on desktop where
    // there's no swipe gesture.
    document.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const slides = Array.from(scrollEl.querySelectorAll(".feed-slide"));
      const containerTop = scrollEl.getBoundingClientRect().top;
      let currentIndex = 0;
      let smallestDiff = Infinity;
      slides.forEach((slide, i) => {
        const diff = Math.abs(slide.getBoundingClientRect().top - containerTop);
        if (diff < smallestDiff) { smallestDiff = diff; currentIndex = i; }
      });
      const nextIndex = e.key === "ArrowDown"
        ? Math.min(slides.length - 1, currentIndex + 1)
        : Math.max(0, currentIndex - 1);
      if (slides[nextIndex]) slides[nextIndex].scrollIntoView({ behavior: "smooth" });
    });
  })();
</script>
</body>
</html>
